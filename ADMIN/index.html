<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bajrang AI — Admin Panel</title>
  <link rel="icon" type="image/png" href="image.png">
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <style>
    :root {
      --void: #000;
      --carbon: #080808;
      --smoke: #1a1a1a;
      --border: rgba(255, 255, 255, 0.07);
      --text: #fff;
      --muted: #888;
      --dim: #3d3d3d;
      --accent: #6366f1;
      --accent-g: linear-gradient(135deg, #6366f1, #a855f7);
      --green: #10b981;
      --red: #ef4444;
      --amber: #f59e0b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Outfit', sans-serif;
    }

    body {
      background: var(--void);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 8, 8, 0.9);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .top-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-logo img {
      height: 30px;
      border-radius: 6px;
    }

    .top-logo span {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.1rem;
      font-weight: 700;
      background: var(--accent-g);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #a5b4fc;
      font-size: 0.7rem;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
      -webkit-text-fill-color: #a5b4fc;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .refresh-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--smoke);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all .2s;
    }

    .refresh-btn:hover {
      background: rgba(99, 102, 241, 0.1);
      border-color: rgba(99, 102, 241, 0.3);
      color: #fff;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        box-shadow: 0 0 4px var(--green)
      }

      50% {
        box-shadow: 0 0 12px var(--green), 0 0 24px rgba(16, 185, 129, .3)
      }
    }

    /* Stats row */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      padding: 24px 32px;
    }

    .stat-card {
      background: var(--carbon);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .stat-value {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 700;
    }

    .stat-value.purple {
      background: var(--accent-g);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stat-value.green {
      color: var(--green);
    }

    .stat-value.amber {
      color: var(--amber);
    }

    .stat-sub {
      font-size: 0.72rem;
      color: var(--dim);
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 32px 20px;
      flex-wrap: wrap;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 220px;
      background: var(--carbon);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 16px;
    }

    .search-box input {
      background: none;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      outline: none;
      width: 100%;
    }

    .search-box input::placeholder {
      color: var(--dim);
    }

    .filter-select {
      background: var(--carbon);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .filter-select option {
      background: #111;
    }

    .count-tag {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      margin-left: auto;
    }

    /* Table */
    .table-wrap {
      padding: 0 32px 40px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead th {
      text-align: left;
      font-size: 0.72rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .5px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-weight: 600;
    }

    tbody tr {
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
    }

    tbody tr:hover {
      background: rgba(99, 102, 241, 0.05);
    }

    td {
      padding: 14px 16px;
      font-size: 0.88rem;
      vertical-align: top;
    }

    .td-user {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-avatar {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: var(--accent-g);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-founder {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
    }

    .user-name {
      font-weight: 500;
    }

    .user-id {
      font-size: 0.72rem;
      color: var(--dim);
    }

    .msg-preview {
      color: var(--muted);
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .response-preview {
      color: var(--text);
      max-width: 320px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .intent-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .intent-CHIT_CHAT {
      background: rgba(99, 102, 241, .15);
      color: #a5b4fc;
    }

    .intent-WEB_SEARCH {
      background: rgba(16, 185, 129, .15);
      color: #6ee7b7;
    }

    .intent-LOCAL_DB {
      background: rgba(245, 158, 11, .15);
      color: #fcd34d;
    }

    .intent-MEMORY {
      background: rgba(168, 85, 247, .15);
      color: #d8b4fe;
    }

    .intent-STREAMED {
      background: rgba(99, 102, 241, .1);
      color: #818cf8;
    }

    .intent-ERROR {
      background: rgba(239, 68, 68, .15);
      color: #fca5a5;
    }

    .time-col {
      color: var(--dim);
      font-size: 0.78rem;
      white-space: nowrap;
    }

    /* Loading / empty */
    .loading-state,
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      gap: 14px;
      color: var(--muted);
    }

    .loading-ring {
      width: 40px;
      height: 40px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* Modal */
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .88);
      backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .3s ease;
    }

    .modal-bg.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: linear-gradient(145deg, #111113, #0a0a0c);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      max-width: 700px;
      width: 94%;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      transform: translateY(24px) scale(.97);
      transition: transform .35s cubic-bezier(.16, 1, .3, 1), opacity .3s ease;
      opacity: 0;
      box-shadow: 0 40px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(99,102,241,.08);
    }

    .modal-bg.open .modal {
      transform: translateY(0) scale(1);
      opacity: 1;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }

    .modal-head h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-head-icon {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: var(--accent-g);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .close-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: var(--muted);
      cursor: pointer;
      padding: 7px;
      border-radius: 10px;
      transition: all .2s;
      display: flex;
      align-items: center;
    }

    .close-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, .1);
      border-color: rgba(255,255,255,0.15);
    }

    .modal-body {
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .detail-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .detail-label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .detail-label {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .8px;
      font-weight: 600;
    }

    .copy-btn {
      background: none;
      border: none;
      color: var(--dim);
      cursor: pointer;
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 3px 8px;
      border-radius: 6px;
      transition: all .2s;
    }

    .copy-btn:hover {
      color: var(--accent);
      background: rgba(99,102,241,0.1);
    }

    .copy-btn.copied {
      color: var(--green);
    }

    .detail-value {
      font-size: 0.9rem;
      color: var(--text);
      line-height: 1.5;
    }

    .msg-box {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px;
      padding: 16px 18px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.9rem;
      max-height: 260px;
      overflow-y: auto;
    }

    .msg-box.user-box {
      border-left: 3px solid var(--accent);
      background: rgba(99,102,241,0.04);
    }

    .msg-box.ai-box {
      border-left: 3px solid var(--green);
      color: #ccc;
      background: rgba(16,185,129,0.04);
    }

    .meta-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .meta-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      padding: 6px 12px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .meta-chip strong {
      color: var(--text);
      font-weight: 500;
    }

    /* Row click hint */
    tbody tr {
      position: relative;
    }
    tbody tr::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 0;
      pointer-events: none;
      transition: background .15s;
    }
    tbody tr:hover::after {
      background: rgba(99,102,241,0.04);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--smoke);
      border-radius: 10px;
    }

    @media(max-width:768px) {
      .stats-row {
        grid-template-columns: repeat(2, 1fr);
        padding: 16px;
      }

      .toolbar,
      .table-wrap {
        padding: 0 16px 30px;
      }

      .top-bar {
        padding: 14px 16px;
      }

      .top-right .refresh-btn span {
        display: none;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->
  <div class="top-bar">
    <div class="top-logo">
      <img src="image.png" alt="logo">
      <span>Bajrang AI</span>
      <div class="badge">ADMIN</div>
    </div>
    <div class="top-right">
      <div class="live-dot"></div>
      <button class="refresh-btn" onclick="loadData()">
        <i data-lucide="refresh-cw" style="width:14px;height:14px"></i>
        <span>Refresh</span>
      </button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">Total Chats</div>
      <div class="stat-value purple" id="s-total">—</div>
      <div class="stat-sub">All time</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Unique Users</div>
      <div class="stat-value green" id="s-users">—</div>
      <div class="stat-sub">Distinct user IDs</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Web Searches</div>
      <div class="stat-value amber" id="s-web">—</div>
      <div class="stat-sub">Live internet queries</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Last Activity</div>
      <div class="stat-value" id="s-last" style="font-size:1.1rem;color:#fff">—</div>
      <div class="stat-sub">Most recent chat</div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-box">
      <i data-lucide="search" style="width:16px;height:16px;color:#555"></i>
      <input type="text" id="search-input" placeholder="Search messages..." oninput="filterTable()">
    </div>
    <select class="filter-select" id="intent-filter" onchange="filterTable()">
      <option value="">All Intents</option>
      <option value="CHIT_CHAT">Chit Chat</option>
      <option value="WEB_SEARCH">Web Search</option>
      <option value="LOCAL_DB">Local DB</option>
      <option value="STREAMED">Streamed</option>
      <option value="MEMORY">Memory</option>
      <option value="ERROR">Error</option>
    </select>
    <select class="filter-select" id="user-filter" onchange="filterTable()">
      <option value="">All Users</option>
    </select>
    <div class="count-tag" id="count-tag">Loading...</div>
  </div>

  <!-- Table -->
  <div class="table-wrap">
    <div class="loading-state" id="loading-state">
      <div class="loading-ring"></div>
      <span>Fetching from Firebase...</span>
    </div>
    <div class="empty-state" id="empty-state" style="display:none">
      <i data-lucide="inbox" style="width:40px;height:40px;color:#333"></i>
      <span>No records found</span>
    </div>
    <table id="data-table" style="display:none">
      <thead>
        <tr>
          <th>#</th>
          <th>User</th>
          <th>Message</th>
          <th>Response</th>
          <th>Intent</th>
          <th>Timestamp</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <!-- Detail Modal -->
  <div class="modal-bg" id="modal-bg" onclick="closeModal(event)">
    <div class="modal">
      <div class="modal-head">
        <h2>
          <div class="modal-head-icon">?</div>
          <span>Guest</span>
        </h2>
        <button class="close-btn" onclick="document.getElementById('modal-bg').classList.remove('open')">
          <i data-lucide="x" style="width:18px;height:18px"></i>
        </button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    // ── Firebase Init ────────────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyBKWBvPPaetrwT1lvRCCyXDDgiStq8vXfY",
      authDomain: "rainbowtracking.firebaseapp.com",
      projectId: "rainbowtracking",
      storageBucket: "rainbowtracking.firebasestorage.app",
      messagingSenderId: "216615916843",
      appId: "1:216615916843:web:9456bdedaf7399fbe6216e",
      measurementId: "G-HMDM9QNDZ5"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ── State ────────────────────────────────────────────────
    let allDocs = [];
    let filtered = [];

    // ── Load Data ────────────────────────────────────────────
    async function loadData() {
      document.getElementById('loading-state').style.display = 'flex';
      document.getElementById('data-table').style.display = 'none';
      document.getElementById('empty-state').style.display = 'none';

      try {
        const snap = await db.collection('chats').orderBy('timestamp', 'desc').limit(500).get();
        allDocs = snap.docs.map((d, i) => ({ id: d.id, ...d.data(), _idx: i + 1 }));
        buildUserFilter();
        updateStats();
        filterTable();
      } catch (e) {
        console.error(e);
        document.getElementById('loading-state').innerHTML = `<span style="color:#ef4444">⚠️ Firebase Error: ${e.message}</span>`;
      }
    }

    function buildUserFilter() {
      const sel = document.getElementById('user-filter');
      const users = [...new Set(allDocs.map(d => d.user_id).filter(Boolean))].sort();
      sel.innerHTML = '<option value="">All Users</option>';
      users.forEach(u => {
        const opt = document.createElement('option');
        opt.value = u; opt.textContent = u;
        sel.appendChild(opt);
      });
    }

    function updateStats() {
      const total = allDocs.length;
      const users = new Set(allDocs.map(d => d.user_id).filter(Boolean)).size;
      const webCount = allDocs.filter(d => d.intent === 'WEB_SEARCH').length;
      const lastTs = allDocs.length ? formatTime(allDocs[0].timestamp) : '—';

      document.getElementById('s-total').textContent = total;
      document.getElementById('s-users').textContent = users;
      document.getElementById('s-web').textContent = webCount;
      document.getElementById('s-last').textContent = lastTs;
    }

    function filterTable() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const intent = document.getElementById('intent-filter').value;
      const user = document.getElementById('user-filter').value;

      filtered = allDocs.filter(d => {
        const matchQ = !q || (d.user_message || '').toLowerCase().includes(q) || (d.ai_response || '').toLowerCase().includes(q);
        const matchIntent = !intent || d.intent === intent;
        const matchUser = !user || d.user_id === user;
        return matchQ && matchIntent && matchUser;
      });

      renderTable();
      document.getElementById('count-tag').textContent = `${filtered.length} record${filtered.length !== 1 ? 's' : ''}`;
    }

    function renderTable() {
      const tbody = document.getElementById('table-body');
      const table = document.getElementById('data-table');
      const empty = document.getElementById('empty-state');
      document.getElementById('loading-state').style.display = 'none';

      if (!filtered.length) {
        table.style.display = 'none';
        empty.style.display = 'flex';
        return;
      }

      empty.style.display = 'none';
      table.style.display = 'table';

      tbody.innerHTML = filtered.map((d, i) => {
        const userId = d.user_id || 'guest';
        const isFounder = userId === 'piyush_ceo';
        const initial = userId.charAt(0).toUpperCase();
        const intentClass = `intent-${(d.intent || 'CHIT_CHAT').replace(/\s/g, '_')}`;
        const intentLabel = (d.intent || 'CHIT_CHAT').replace(/_/g, ' ');
        const msgPrev = truncate(d.user_message || '—', 55);
        const resPrev = truncate(d.ai_response || '—', 60);
        const ts = formatTime(d.timestamp);

        return `
        <tr onclick='openModal(${i})'>
          <td style="color:var(--dim);font-size:0.78rem">${i + 1}</td>
          <td>
            <div class="td-user">
              <div class="user-avatar ${isFounder ? 'user-founder' : ''}">${initial}</div>
              <div>
                <div class="user-name">${userId}</div>
              </div>
            </div>
          </td>
          <td><div class="msg-preview">${escHtml(msgPrev)}</div></td>
          <td><div class="response-preview">${escHtml(resPrev)}</div></td>
          <td><span class="intent-tag ${intentClass}">${intentLabel}</span></td>
          <td class="time-col">${ts}</td>
        </tr>
      `;
      }).join('');
    }

    // ── Modal ────────────────────────────────────────────────
    // Use index-based access — no JSON serialization issues
    function openModal(idx) {
      const d = filtered[idx];
      if (!d) return;

      const userId = d.user_id || 'guest';
      const initial = userId.charAt(0).toUpperCase();
      const ts = formatTime(d.timestamp);
      const intentClass = `intent-${(d.intent || 'CHIT_CHAT')}`;
      const intentLabel = (d.intent || 'CHIT_CHAT').replace(/_/g, ' ');
      const userMsg = d.user_message || '—';
      const aiResp = d.ai_response || '—';

      // Update modal header avatar + name
      document.querySelector('.modal-head-icon').textContent = initial;
      document.querySelector('.modal-head h2 span').textContent = userId;

      // Build body HTML
      const body = document.getElementById('modal-body');
      body.innerHTML = '';

      // Meta chips row
      const chips = document.createElement('div');
      chips.className = 'meta-chips';
      chips.innerHTML = `
        <div class="meta-chip"><span class="intent-tag ${intentClass}" style="margin:0">${intentLabel}</span></div>
        <div class="meta-chip">🕐 <strong>${ts}</strong></div>
        <div class="meta-chip" style="font-family:monospace;font-size:0.75rem;color:var(--dim)">${escHtml(d.id || '')}</div>
      `;
      body.appendChild(chips);

      // User message block
      const userRow = document.createElement('div');
      userRow.className = 'detail-row';
      userRow.innerHTML = `
        <div class="detail-label-row">
          <div class="detail-label">💬 User Message</div>
          <button class="copy-btn" onclick="copyEl(this.nextElementSibling)">⎘ Copy</button>
        </div>
      `;
      const userBox = document.createElement('div');
      userBox.className = 'msg-box user-box';
      userBox.textContent = userMsg;
      userRow.appendChild(userBox);
      body.appendChild(userRow);

      // AI response block
      const aiRow = document.createElement('div');
      aiRow.className = 'detail-row';
      aiRow.innerHTML = `
        <div class="detail-label-row">
          <div class="detail-label">🤖 AI Response</div>
          <button class="copy-btn" onclick="copyEl(this.nextElementSibling)">⎘ Copy</button>
        </div>
      `;
      const aiBox = document.createElement('div');
      aiBox.className = 'msg-box ai-box';
      aiBox.textContent = aiResp;
      aiRow.appendChild(aiBox);
      body.appendChild(aiRow);

      // Show modal
      document.getElementById('modal-bg').classList.add('open');
      body.scrollTop = 0;
    }

    function copyEl(el) {
      if (!el) return;
      const btn = el.previousElementSibling?.querySelector('.copy-btn') || el.parentElement.querySelector('.copy-btn');
      navigator.clipboard.writeText(el.textContent).then(() => {
        if (btn) { btn.textContent = '✓ Copied!'; btn.classList.add('copied'); }
        setTimeout(() => { if (btn) { btn.textContent = '⎘ Copy'; btn.classList.remove('copied'); } }, 2000);
      }).catch(() => {
        // Fallback
        const ta = document.createElement('textarea');
        ta.value = el.textContent;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      });
    }

    function closeModal(e) {
      if (!e || e.target === document.getElementById('modal-bg')) {
        document.getElementById('modal-bg').classList.remove('open');
      }
    }

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    // ── Helpers ──────────────────────────────────────────────
    function truncate(str, n) { return str.length > n ? str.slice(0, n) + '…' : str; }
    function escHtml(s) {
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function formatTime(ts) {
      if (!ts) return '—';
      try {
        let d;
        if (typeof ts === 'string') d = new Date(ts);
        else if (ts.toDate) d = ts.toDate();
        else d = new Date(ts);
        return d.toLocaleString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true, timeZone: 'Asia/Kolkata' });
      } catch { return String(ts); }
    }

    // ── Init ─────────────────────────────────────────────────
    lucide.createIcons();
    loadData();
  </script>
</body>

</html>
